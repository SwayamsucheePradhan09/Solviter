<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report an Issue – SOLVITER</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
</head>
<body class="bg-gradient-to-br from-red-100 via-white to-pink-50 font-sans">

  <section id="report" class="py-20 px-6">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-10 text-center">
      <div class="mb-8">
        <h2 class="text-4xl md:text-5xl font-bold text-gray-900 font-[Space_Grotesk] mb-2">📢 Report an Issue</h2>
        <p class="text-gray-600 text-md">Help us improve by reporting bugs or giving suggestions.</p>
      </div>

      <form class="space-y-6 text-left">
        <!-- Name and Email -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input type="text" placeholder="First Name" required class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-800" />
          <input type="text" placeholder="Username / Email" required class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-800" />
        </div>

        <!-- Issue Type -->
        <div>
          <select required class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-800 bg-white">
            <option value="bug" selected>Bug</option>
            <option value="feature">Feature Request</option>
            <option value="ui">UI Issue</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Message -->
        <div>
          <textarea rows="4" placeholder="Describe your issue or suggestion..." required class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-800 resize-none"></textarea>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" class="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-semibold py-3 rounded-full shadow-md hover:shadow-xl transition">Submit Report</button>
        </div>
      </form>
    </div>
  </section>

</body>
</html>
